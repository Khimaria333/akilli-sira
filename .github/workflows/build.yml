name: APK oluştur

on:
  push:
    branches: ['**']
    paths-ignore: ['cloud/**', '.github/workflows/cloud.yml', 'README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yı derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk Ahenk.apk

      - name: Sürüm notu
        run: git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt

      - name: Releases sayfasına koy
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ahenk ${{ github.run_number }}
          body_path: notes.txt
          files: Ahenk.apk
          make_latest: true
